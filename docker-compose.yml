services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: retail_analytics_db
    ports:
      - "3308:3306"
    volumes:
      - retail_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: retail_analytics_db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@retail.com}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?Set ADMIN_DEFAULT_PASSWORD in .env}
      DATASET_PATH: /app/online_retail_II.xlsx
      REPORTS_DIR: /app/reports/generated
    ports:
      - "8004:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - retail_reports:/app/reports/generated
      - ./online_retail_II.xlsx:/app/online_retail_II.xlsx:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - backend

volumes:
  retail_mysql_data:
  retail_reports:
